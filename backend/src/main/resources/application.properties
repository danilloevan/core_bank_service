# ===================================================================
# Core Bank Service - Quarkus Reactive Configuration
# ===================================================================
quarkus.application.name=core-bank-service
quarkus.http.port=8080

# Datasource Reativo (PostgreSQL - Porta 5435 no docker-compose para não conflitar com Postgres local na 5432)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:corebank}
quarkus.datasource.password=${DB_PASSWORD:corebank_secret}
quarkus.datasource.reactive.url=vertx-reactive:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:corebank_db}
quarkus.datasource.reactive.max-size=20
quarkus.devservices.enabled=false
quarkus.compose.devservices.enabled=false

# Hibernate Reactive ORM
quarkus.hibernate-orm.schema-management.strategy=update
%dev.quarkus.hibernate-orm.log.sql=true
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# OpenAPI & Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.info-title=Core Bank Service API (UFC - POO)
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Mini Core Bancário Reativo com Ledger Imutável (Partidas Dobradas), Quarkus e SmallRye Mutiny.

# Parâmetros de Negócio do Core Bancário
corebank.ispb=12345678
corebank.ted.validar-janela-horario=false
corebank.ted.tarifa-fixa=12.50
corebank.pix.limite-noturno-padrao=1000.00
